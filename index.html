<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bad-code-converter</title>
  <link rel="icon" href="use.ico">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 40px;
      position: relative;
      min-height: 100vh;
      font-size: 24px; /* 基本フォントサイズを大きめに */
    }
    
    /* タイトルを左上に固定 */
    .header {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px;
    }
    
    .header h1 {
      margin: 0;
      font-size: 36px;  /* タイトルのフォントサイズを大きく */
    }
    
    /* コンテナのサイズを大きく */
    .container {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      width: 90%;
      max-width: 1400px;
      margin: 120px auto 0 auto; /* ヘッダーとの余白を確保 */
    }
    
    .content {
      display: flex;
      justify-content: space-between;
      gap: 30px;
    }
    
    .section {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    
    label {
      margin-bottom: 10px;
      font-weight: bold;
    }
    
    textarea {
      width: 100%;
      height: 400px;  /* テキストエリアの高さを大きく */
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 24px;  /* テキストエリア内の文字サイズを大きく */
      resize: none;
    }
    
    .button-group {
      display: flex;
      margin-left: 80px;
      margin-right: 40px;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }
    
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 15px 25px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 24px;  /* ボタン内の文字サイズを大きく */
      transition: background 0.3s;
      width: 200px;
    }
    
    button:hover {
      background-color: #0056b3;
    }
    
    #result {
      margin-top: 30px;
      text-align: center;
    }
  </style>
</head>
<body>
  <!-- タイトルは常に左上に表示 -->
  <div class="header">
    <h1>Bad code converter</h1>
  </div>
  
  <div class="container">
    <div class="content">
      <div class="section">
        <label for="inputCode">クソコードにする前のJSコード:</label>
        <textarea id="inputCode"></textarea>
      </div>
      
      <div class="button-group">
        <button id="convertButton">クソコードに変換する</button>
        <button onclick="downloadJS()">ファイルとしてダウンロード</button>
        <button onclick="runCode()">実行</button>
      </div>
      
      <div class="section">
        <label for="outputCode">クソコード:</label>
        <textarea id="outputCode" readonly></textarea>
      </div>
    </div>
  </div>
  <div id="result"></div>

  <script>
    function runCode() {
      const code = document.getElementById("outputCode").value;
      try {
        const result = eval(code);
        document.getElementById("result").innerText = "実行結果: " + result;
      } catch (error) {
        document.getElementById("result").innerText = "エラー: " + error;
      }
    }
    
    function downloadJS() {
      const code = document.getElementById("outputCode").value;
      const blob = new Blob([code], { type: 'text/javascript' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'ConvertToBADscript.js';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
  <script src="converter.js"></script>
  <script src="test.js"></script>
</body>
</html>
